server:
  port: 8080

spring:
  config:
    import:
      - classpath:application-keys.yml  # 导入密钥配置文件
  datasource:
    url: jdbc:mysql://localhost:3306/personal_dev?characterEncoding=UTF8&serverTimezone=Asia/Shanghai
    username: ${keys.db-username}
    password: ${keys.db-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${keys.redis-password}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted  # 逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# 阿里云OSS配置（建议将AccessKey放在环境变量中避免泄露）
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${keys.oss-access-key-id}
    access-key-secret: ${keys.oss-access-key-secret}
    bucket-name: ${keys.oss-bucket-name}
# JWT配置
jwt:
  secret: ${keys.jwt-secret}
  expiration: 7200000 # 过期时间，单位毫秒
  header: access_token  # JWT头名称
  prefix: access_token # JWT前缀

# 日志配置
logging:
  level:
    root.zhengyang: debug
  file:
      name: D:\IDEA\IDEAProject\personal_detail\logs\personal_detail.log  # 日志文件存储路径
